name: Test python

on:
  pull_request:
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - dbt_artifacts_parser/**/*.py
      - tests/**/*.py
      - pylintrc
  push:
    branches:
      - main
    paths:
      - .github/workflows/test.yml
      - noxfile.py
      - pyproject.toml
      - dbt_artifacts_parser/**/*.py
      - tests/**/*.py
      - pylintrc
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Test supported Python versions
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true
      - name: Install supported Python versions
        run: uv python install 3.11 3.12
      - name: Run tests across Python versions in parallel
        run: |
          set -euo pipefail
          nox_spec='nox[uv]==2026.7.11'
          uvx --from "${nox_spec}" nox --list >/dev/null
          printf '%s\0' 3.11 3.12 \
            | xargs -0 -P "$(nproc)" -I{} \
                uvx --from "${nox_spec}" nox --session "tests-{}"
      - name: Prepare primary validation environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Trunk Check
        if: github.event_name != 'push'
        uses: trunk-io/trunk-action@v1
